name: Build SIYOMA Tenant Rent Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android project from ZIP
        run: |
          unzip -q -o SIYOMA_Tenant_Rent_Tracker_V1_FIXED.zip
          chmod +x gradlew
          echo "Project files:"
          ls -la
          echo "App module:"
          ls -la app

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SIYOMA-Tenant-Rent-Tracker-V1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
